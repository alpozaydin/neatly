# GitHub Pages: alpozaydin.github.io/neatly shows the README as a web page (findable on Google).
title: "neatly — free AI file renamer for Mac"
tagline: "Free, private, on-device"
description: "Clear names for your downloads, screenshots and photos, automatically. Private, on-device with Apple Intelligence. Free and open source."
url: "https://alpozaydin.github.io"
baseurl: "/neatly"
twitter:
  card: summary_large_image
defaults:
  - scope: { path: "" }
    values:
      image: /docs/assets/social.png
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude: [README.md, AGENTS.md, Sources, Tests, scripts, workflows, Package.swift, LICENSE, .github, HANDOFF.md, TODO.md]
author: alpozaydin
social:
  name: neatly
  links:
    - https://github.com/alpozaydin/neatly
